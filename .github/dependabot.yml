version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      semua:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (versi native) belum didukung pemeriksaan tipe Next.js.
      # Naikkan manual setelah Next.js mendukungnya.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
