name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Tanpa FIRMS_MAP_KEY build memakai data contoh, cukup untuk memastikan kode terkompilasi.
      - run: npm run build
